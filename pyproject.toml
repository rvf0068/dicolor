[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dicolor"
version = "0.1.0"
description = "Directed graph analysis: dichromatic numbers and dihomomorphisms."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Rafael Villarroel", email = "rvf0068@gmail.com"}
]
license = {text = "MIT"}
keywords = ["digraph", "graph", "dihomomorphism", "dichromatic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "networkx>=2.5",
    "pycombtop @ git+https://github.com/rvf0068/pycliques-project.git#subdirectory=packages/pycombtop",
    "pycliques @ git+https://github.com/rvf0068/pycliques-project.git#subdirectory=packages/pycliques",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-cov",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints",
]
dev = [
    "ruff>=0.1",
    "mypy>=0.9",
]

[project.urls]
Homepage = "https://github.com/rvf0068/dicolor"
Documentation = "https://rvf0068.github.io/dicolor/"
Repository = "https://github.com/rvf0068/dicolor.git"
Issues = "https://github.com/rvf0068/dicolor/issues"

[tool.setuptools]
packages = ["dicolor"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
dicolor = ["data/*.d6", "data/*.d6.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 88
target-version = "py38"
